<!DOCTYPE html>
<html>
<head>
    <script>
        // GitHub возвращает сюда после авторизации
        // Перенаправляем в админку с правильным хэшем
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        
        if (code && state) {
            // Правильный формат для Decap CMS
            window.location.href = `https://nic-ktp.com/news/admin/#/auth?code=${code}&state=${state}`;
        } else {
            // Просто на главную админки
            window.location.href = 'https://nic-ktp.com/news/admin/';
        }
    </script>
</head>
<body>
    <p>Перенаправление в админку...</p>
</body>
</html>
