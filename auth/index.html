<!DOCTYPE html>
<html>
<head>
    <script>
        // GitHub возвращает сюда после авторизации
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        
        console.log('Callback received. Code:', code ? 'YES' : 'NO');
        
        if (code && state) {
            // ПРАВИЛЬНЫЙ ФОРМАТ: параметры в query string, не в hash!
            const redirectUrl = `https://nic-ktp.com/news/admin/?code=${code}&state=${state}`;
            console.log('Redirecting to:', redirectUrl);
            window.location.href = redirectUrl;
        } else {
            console.log('No auth parameters, going to admin');
            window.location.href = 'https://nic-ktp.com/news/admin/';
        }
    </script>
</head>
<body>
    <p>Обработка авторизации GitHub...</p>
</body>
</html>
