<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Научно-исследовательский центр по перспективным направлениям развития железнодорожного транспорта.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="news-style.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="icon" href="../images/logo_no_shades.png" type="image/png">
    <script src="https://code.jquery.com/jquery-2.2.0.min.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
    <title>Новости - ТОО НИЦ КТП</title>
</head>
<body>
    <header>
    <div class="container">
        <div class="header__content">
            <a href="">
                <img src="../images/logo_no_shades.png" class="img__logo">
            </a>
            <nav class="nav" id="nav">
                <ul class="header-nav">
                    <li><a href="../index.html" class="nav__link">Главная</a></li>
                    <li><a href="#contacts" class="nav__link">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </div>
   </header> 
    
    <main class="container">
        <div class="news-header">
            <h1 id="news-title">Заголовок новости</h1>
            <div class="news-meta">
                <span id="news-date">Дата публикации</span>
            </div>
        </div>
        
        <div class="carousel-container">
            <div class="carousel" id="news-carousel">
                <!-- Карусель будет заполнена JavaScript -->
            </div>
            <div class="carousel-controls">
                <button class="carousel-btn" id="prev-btn">&#8592;</button>
                <button class="carousel-btn" id="next-btn">&#8594;</button>
            </div>
        </div>
        
        <div class="news-content">
            <div id="news-full-text" style="margin-bottom: 20px;">
                <!-- Полный текст новости будет заполнен JavaScript -->
            </div>
            <a href="../news/news.html" class="back-link">← Вернуться к списку новостей</a>
        </div>
    </main>
    
    <footer id="contacts" itemscope="itemscope" itemtype="http://schema.org/Organization">
    <div class="container">
        <div class="footer__content">
            <a href="#">
                <img src="../images/logo_no_shades.png" class="img__logo">
            </a>
        <div class="footer__info">
            <div class="footer__text">
                <meta itemprop="name" content="Научно-исследовательский центр комплексных транспортных проблем (НИЦ КТП)">
                <div itemprop="address" itemscope itemtype="http://schema.org/PostalAddress">
                    <p><span itemprop="addressCountry">Республика Казахстан,</span> 010000, <span  itemprop="addressLocality">г. Астана,</span> <span itemprop="streetAddress">Сығанақ, 60/4, 
БЦ «Abu Dhabi Plaza», офис 504</span></p>
                <p>email: <span itemprop="email"><a href="mailto: contact@nic-ktp.com">contact@nic-ktp.com</a></span></p>
                <p>Instagram: <a href="https://www.instagram.com/nic_ktp.kz/" target="_blank">nic_ktp.kz</a></p>
            </div>
            <p style="margin: 0;" id="footer__years"></p>
        </div>
        </div>
    </div>
   </footer>

    <script src="../news/news-data.js"></script>
    <script>
        // дата в футере
        document.getElementById('footer__years').innerHTML = '2007 - ' + new Date().getFullYear(); 

        let currentSlide = 0;
        
        function showNewsPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            
            if (!newsId || !newsData[newsId]) {
                document.getElementById('news-title').textContent = 'Новость не найдена';
                return;
            }
            
            const news = newsData[newsId];

            document.getElementById('news-title').textContent = news.title;
            document.getElementById('news-date').textContent = news.date;
            document.title = `${news.title}`;
            
            const carousel = document.getElementById('news-carousel');
            carousel.innerHTML = '';
            
            news.media.forEach((item, index) => {
                const carouselItem = document.createElement('div');
                carouselItem.className = 'carousel-item';
                
                if (item.type === 'image') {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.caption;
                    carouselItem.appendChild(img);
                } else if (item.type === 'video') {
                    const video = document.createElement('video');
                    video.src = item.src;
                    video.controls = true;
                    carouselItem.appendChild(video);
                }
                
                const caption = document.createElement('div');
                caption.className = 'carousel-caption';
                caption.textContent = item.caption;
                carouselItem.appendChild(caption);
                
                carousel.appendChild(carouselItem);
            });
            
            document.getElementById('news-full-text').innerHTML = news.content;
            
            currentSlide = 0;
            updateCarousel();
        }
        
        function updateCarousel() {
            const carousel = document.getElementById('news-carousel');
            carousel.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        
        document.getElementById('next-btn').addEventListener('click', function() {
            const totalSlides = document.querySelectorAll('.carousel-item').length;
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        });
        
        document.getElementById('prev-btn').addEventListener('click', function() {
            const totalSlides = document.querySelectorAll('.carousel-item').length;
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        });
        
        document.addEventListener('DOMContentLoaded', showNewsPage);
    </script>
</body>
</html>
