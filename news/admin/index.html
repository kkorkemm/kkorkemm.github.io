<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка новостей</title>
  <!-- Netlify Identity для аутентификации -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Стили для красивого интерфейса -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .login-wrapper { 
      max-width: 400px; margin: 100px auto; padding: 20px; 
      text-align: center; 
    }
    .login-btn {
      background: #00c7b7; color: white; padding: 12px 24px;
      border: none; border-radius: 4px; cursor: pointer;
      font-size: 16px; margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Контейнер для CMS -->
  <div id="ncms-root"></div>
  
  <!-- Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  
  <!-- Скрипт для обработки аутентификации -->
  <script>
    // Автоматический вход после аутентификации
    if (window.location.hash) {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      if (params.get('access_token')) {
        localStorage.setItem('netlify-cms-user', JSON.stringify({
          token: params.get('access_token'),
          expires_at: Date.now() + (params.get('expires_in') * 1000)
        }));
        window.location.hash = '';
      }
    }
    
    // Проверка авторизации
    if (!localStorage.getItem('netlify-cms-user')) {
      document.body.innerHTML = `
        <div class="login-wrapper">
          <h1>Админ-панель новостей</h1>
          <p>Требуется авторизация через GitHub</p>
          <button class="login-btn" onclick="login()">Войти через GitHub</button>
        </div>
      `;
    }
    
    function login() {
      const clientId = 'Ov23lizJaxcNgHAO46ro'; // Получите на GitHub
      const redirectUri = encodeURIComponent(window.location.origin + '/admin/');
      const scope = encodeURIComponent('repo');
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&scope=${scope}`;
    }


        // В admin/index.html перед загрузкой CMS
    CMS.registerEventListener({
    name: 'preSave',
    handler: ({ entry }) => {
        const data = entry.get('data');
        
        // Автогенерация ID если пустой
        if (!data.get('id')) {
        const title = data.get('title');
        const id = title
            .toLowerCase()
            .replace(/[^\w\s]/gi, '')
            .replace(/\s+/g, '-')
            .substring(0, 50);
        
        return entry.get('data').set('id', `news-${id}`);
        }
        
        return data;
    }
    });

  </script>
</body>
</html>
