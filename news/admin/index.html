<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка новостей</title>
    <style>
        /* Скрываем до загрузки */
        body { opacity: 0; }
        body.loaded { opacity: 1; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="nc-root"></div>
    
    <!-- Сначала наш скрипт -->
    <script src="/news/admin/cms.js"></script>
    <!-- Потом Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
        // Принудительная загрузка
        document.body.classList.add('loaded');
        
        // Очистка старого состояния
        if (window.location.search.includes('force')) {
            localStorage.removeItem('netlify-cms-user');
            localStorage.removeItem('github.settings');
        }
    </script>
</body>
</html>
