backend:
  name: github
  repo: kkorkemm/kkorkemm.github.io
  branch: main
  site_domain: nic-ktp.com

# Локализация (русский интерфейс)
locale: 'ru'

# Настройки медиа
media_folder: "news-media" # Папка для загрузки изображений
public_folder: "/news-media" # Публичный URL

# Режим публикации (с черновиками)
publish_mode: editorial_workflow
site_url: "https://nic-ktp.com"

# Настройки редактора
editor:
  preview: false # Отключаем предпросмотр, если не настроен

# Коллекция новостей
collections:
  - name: "news"
    label: "Новости"
    label_singular: "Новость"
    folder: "_posts/news" # Укажите вашу папку с новостями
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    frontmatter_delimiter: ["---", "---"]
    
    # Сортировка по дате (новые сверху)
    sortable_fields: ["date"]
    sort_dir: "descending"
    
    # Поля (соответствуют вашему формату)
    fields:
      # Обязательное поле ID
      - label: "ID"
        name: "id"
        widget: "string"
        pattern: ["^[a-z0-9\\-]+$", "Только латиница, цифры и дефисы"]
        hint: "Уникальный идентификатор, например: news-1"
        required: true
      
      # Заголовок
      - label: "Заголовок"
        name: "title"
        widget: "string"
        required: true
      
      # Дата публикации
      - label: "Дата публикации"
        name: "date"
        widget: "datetime"
        date_format: "DD.MM.YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        required: true
      
      # Автор
      - label: "Автор"
        name: "author"
        widget: "string"
        required: true
      
      # Медиа-файлы (галерея)
      - label: "Медиа (изображения)"
        name: "media"
        widget: "list"
        allow_add: true
        allow_delete: true
        collapsed: true
        summary: "{{fields.src}}"
        fields:
          - { label: "Тип", name: "type", widget: "hidden", default: "image" }
          - { label: "Файл", name: "src", widget: "image" }
          - { label: "Подпись", name: "caption", widget: "string", required: false }
      
      # Основной текст
      - label: "Содержание"
        name: "body"
        widget: "markdown"
        required: true
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: []